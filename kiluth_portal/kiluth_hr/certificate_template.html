<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiluth Certificate</title>
<!--
  Kiluth certificate, filled by kiluth_hr/certify.py and printed by wkhtmltopdf
  (A4 landscape, no margins). Same layout as the workspace's
  departments/hr/artifacts/certificates/certificate.html, rebuilt with absolute
  positions because wkhtmltopdf's WebKit has no flexbox.
-->
<style>
  {{font_faces}}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 297mm; height: 210mm; }
  body { font-family: "Theinhardt", "Helvetica Neue", Arial, sans-serif; color: #191615; background: #fff; }
  .page { position: relative; width: 297mm; height: 210mm; overflow: hidden; }
  .frame { position: absolute; left: 10mm; top: 10mm; right: 10mm; bottom: 10mm; border: 0.75pt solid #c8c6bf; }
  .body { position: absolute; left: 26mm; top: 22mm; right: 26mm; }
  .logo { width: 34mm; height: auto; }
  .label { margin-top: 26mm; font-size: 11pt; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 400; }
  .course { margin-top: 4mm; font-size: 34pt; font-weight: 400; -webkit-text-stroke: 0.3pt #191615; }
  .lead { margin-top: 14mm; font-size: 12pt; font-weight: 300; }
  .name { margin-top: 3mm; font-size: 28pt; font-weight: 300; }
  .what { margin-top: 6mm; font-size: 11pt; font-weight: 300; width: 170mm; line-height: 1.5; }
  .meta { position: absolute; left: 26mm; right: 26mm; bottom: 22mm; border-top: 0.75pt solid #c8c6bf; padding-top: 5mm; }
  .meta table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 9.5pt; font-weight: 300; }
  .meta td { vertical-align: top; padding-right: 6mm; }
  .meta td + td { border-left: 0.75pt solid #c8c6bf; padding-left: 6mm; }
  .meta b { display: block; font-weight: 400; font-size: 8pt; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 1.5mm; }
</style>
</head>
<body>
<div class="page">
  <div class="frame"></div>
  <div class="body">

    <div class="course">{{course}}</div>
    <div class="lead">This certifies that</div>
    <div class="name">{{name}}</div>
    <div class="what">has passed the Kiluth {{course}} certification test, written from Kiluth Docs, with every answer correct.</div>
  </div>
  <div class="meta">
    <table><tr>
      <td><b>Issued</b>{{issued}}</td>
      <td><b>Valid until</b>{{expires}}</td>

  </div>
</div>
</body>
</html>
